<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlowEditor · 流程图编辑器 UI 原型（半导体工艺）</title>
    <style>
      :root {
        --bg: #f5f7fa;
        --panel: #ffffff;
        --border: #e4e7ed;
        --border-light: #ebeef5;
        --text: #303133;
        --text-2: #606266;
        --text-3: #909399;
        --primary: #409eff;
        --primary-weak: #ecf5ff;
        --success: #67c23a;
        --warning: #e6a23c;
        --danger: #f56c6c;
        --c-litho: #7c5cff;
        --c-etch: #e6a23c;
        --c-film: #409eff;
        --c-metro: #67c23a;
        --c-clean: #17a2b8;
        --c-cmp: #909399;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 -apple-system, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        overflow: hidden;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        min-width: 1180px;
      }

      /* ── 顶栏 ─────────────────────────────── */
      .topbar {
        height: 52px;
        flex: none;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 14px;
      }
      .brand .dot {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: linear-gradient(135deg, var(--primary), #79bbff);
      }
      .fname {
        border: 1px solid transparent;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 13px;
        color: var(--text);
        min-width: 190px;
        background: transparent;
      }
      .fname:hover {
        border-color: var(--border);
      }
      .fname:focus {
        outline: none;
        border-color: var(--primary);
        background: #fff;
      }
      .save-state {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--text-3);
        font-size: 12px;
      }
      .save-state .led {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
      }
      .save-state.is-dirty .led {
        background: var(--warning);
      }
      .spacer {
        flex: 1;
      }
      .btn {
        height: 30px;
        padding: 0 11px;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text-2);
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .btn:hover {
        color: var(--primary);
        border-color: #c6e2ff;
        background: var(--primary-weak);
      }
      .btn.is-disabled {
        color: #c0c4cc;
        cursor: not-allowed;
      }
      .btn.is-disabled:hover {
        background: #fff;
        border-color: var(--border);
        color: #c0c4cc;
      }
      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .btn.primary:hover {
        background: #66b1ff;
        color: #fff;
      }
      .btn-group {
        display: flex;
        gap: 6px;
        margin-right: 6px;
      }
      .divider {
        width: 1px;
        height: 20px;
        background: var(--border);
        margin: 0 4px;
      }
      .export-wrap {
        position: relative;
      }
      /* 配置档位切换（演示「同一组件，不同配置」） */
      .presets {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 6px;
        background: #f5f7fa;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .presets > span {
        font-size: 12px;
        color: var(--text-3);
        margin-right: 2px;
      }
      .presets b {
        font-weight: 500;
        font-size: 12px;
        color: var(--text-2);
        padding: 3px 9px;
        border-radius: 4px;
        cursor: pointer;
      }
      .presets b.on {
        background: var(--primary);
        color: #fff;
      }
      .hidden {
        display: none !important;
      }
      .menu {
        position: absolute;
        top: 34px;
        right: 0;
        width: 186px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        padding: 4px;
        display: none;
        z-index: 30;
      }
      .menu.open {
        display: block;
      }
      .menu div {
        padding: 7px 10px;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        color: var(--text);
      }
      .menu div:hover {
        background: var(--primary-weak);
        color: var(--primary);
      }
      .menu span {
        color: var(--text-3);
        font-size: 12px;
      }

      /* ── 主体三栏 ─────────────────────────── */
      .body {
        flex: 1;
        display: flex;
        min-height: 0;
      }

      /* 左侧元件库 */
      .palette {
        width: 256px;
        flex: none;
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--border-light);
        flex: none;
      }
      .tabs div {
        flex: 1;
        text-align: center;
        padding: 10px 0;
        cursor: pointer;
        color: var(--text-2);
        font-size: 13px;
        border-bottom: 2px solid transparent;
      }
      .tabs div.on {
        color: var(--primary);
        border-bottom-color: var(--primary);
        font-weight: 500;
      }
      /* 元件库配置条（演示 palette 可配置） */
      .pcfg {
        flex: none;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border-light);
        background: #fafbfc;
      }
      .pcfg select {
        width: 100%;
        height: 28px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 12px;
        color: var(--text);
        background: #fff;
        padding: 0 6px;
      }
      .pcfg select:focus {
        outline: none;
        border-color: var(--primary);
      }
      .pcfg .row {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 7px;
      }
      .pcfg .row > span {
        font-size: 11px;
        color: var(--text-3);
        margin-right: 2px;
      }
      .pcfg .chk {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        color: var(--text-2);
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 3px;
        padding: 2px 6px;
        cursor: pointer;
        user-select: none;
      }
      .pcfg .chk input {
        width: 11px;
        height: 11px;
        margin: 0;
        accent-color: var(--primary);
      }
      .pcfg .chk.off {
        color: var(--text-3);
        opacity: 0.7;
      }
      .chip.nodrag {
        cursor: not-allowed;
        opacity: 0.55;
      }
      .search {
        padding: 10px;
        flex: none;
      }
      .search.hidden,
      .hidden {
        display: none !important;
      }
      .search input {
        width: 100%;
        height: 30px;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0 10px;
        font-size: 13px;
        color: var(--text);
      }
      .search input:focus {
        outline: none;
        border-color: var(--primary);
      }
      .plist {
        flex: 1;
        overflow: auto;
        padding: 0 10px 14px;
      }
      .pgroup {
        margin-bottom: 6px;
      }
      .pgroup > h4 {
        margin: 8px 0 6px;
        font-size: 12px;
        color: var(--text-3);
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
      }
      .pgroup > h4 .caret {
        font-size: 10px;
        transition: transform 0.15s;
      }
      .pgroup.collapsed .caret {
        transform: rotate(-90deg);
      }
      .pgroup.collapsed .items {
        display: none;
      }
      .items {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .chip {
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 7px 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: grab;
        background: #fff;
        user-select: none;
      }
      .chip:hover {
        border-color: var(--primary);
        box-shadow: 0 2px 8px rgba(64, 158, 255, 0.18);
      }
      .chip .ico {
        width: 26px;
        height: 22px;
        display: block;
      }
      .chip small {
        font-size: 11px;
        color: var(--text-2);
        text-align: center;
        line-height: 1.2;
      }
      .chip.on-drag {
        opacity: 0.5;
        border-style: dashed;
      }
      .drag-ghost {
        position: fixed;
        pointer-events: none;
        z-index: 99;
        padding: 8px 12px;
        background: #fff;
        border: 1px solid var(--primary);
        border-radius: 5px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        font-size: 12px;
      }

      /* 画布 */
      .stage {
        flex: 1;
        min-width: 0;
        position: relative;
        overflow: hidden;
        background: #fafbfc;
      }
      .canvas {
        position: absolute;
        inset: 0;
        overflow: auto;
      }
      .grid {
        position: absolute;
        left: 0;
        top: 0;
        width: 860px;
        height: 100%;
        min-height: 640px;
        background-image: linear-gradient(var(--border-light) 1px, transparent 1px),
          linear-gradient(90deg, var(--border-light) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      .lane {
        position: absolute;
        border: 1px dashed #dcdfe6;
        border-radius: 8px;
        background: rgba(64, 158, 255, 0.03);
      }
      .lane > b {
        position: absolute;
        top: 8px;
        left: 12px;
        font-size: 12px;
        font-weight: 600;
        color: #a8abb2;
        letter-spacing: 1px;
      }
      .node {
        position: absolute;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 10px 0 0;
        cursor: move;
        overflow: hidden;
      }
      .node .bar {
        width: 4px;
        align-self: stretch;
        flex: none;
      }
      .node .ico {
        width: 22px;
        height: 20px;
        flex: none;
      }
      .node .txt {
        min-width: 0;
      }
      .node .txt b {
        display: block;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
      }
      .node .txt em {
        font-style: normal;
        font-size: 11px;
        color: var(--text-3);
      }
      .node.sel {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.16);
      }
      .node .anchor {
        position: absolute;
        width: 7px;
        height: 7px;
        background: #fff;
        border: 1.5px solid var(--primary);
        border-radius: 50%;
        display: none;
      }
      .node.sel .anchor {
        display: block;
      }
      .node .a-r {
        right: -4px;
        top: 50%;
        margin-top: -3.5px;
      }
      .node .a-b {
        bottom: -4px;
        left: 50%;
        margin-left: -3.5px;
      }
      .node .a-t {
        top: -4px;
        left: 50%;
        margin-left: -3.5px;
      }
      .node.round {
        border-radius: 22px;
        padding-left: 12px;
      }
      .node.note {
        background: #fdf6ec;
        border-color: #f5dab1;
        border-radius: 0;
        align-items: flex-start;
        padding: 8px 10px;
        font-size: 12px;
        color: #8a6d3b;
        line-height: 1.5;
        box-shadow: none;
      }
      .node.diamond {
        background: transparent;
        border: none;
        box-shadow: none;
        padding: 0;
      }
      .edges {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
        pointer-events: none;
      }
      .elabel {
        position: absolute;
        font-size: 11px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0 7px;
        color: var(--text-2);
        transform: translate(-50%, -50%);
        white-space: nowrap;
      }
      .elabel.ng {
        color: var(--danger);
        border-color: #fbc4c4;
        background: #fef0f0;
      }
      .elabel.ok {
        color: var(--success);
        border-color: #b3e19d;
        background: #f0f9eb;
      }

      /* 右下角：小地图 + 缩放 */
      .minimap {
        position: absolute;
        right: 14px;
        bottom: 14px;
        width: 176px;
        height: 118px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }
      .minimap .vp {
        position: absolute;
        border: 1.5px solid var(--primary);
        background: rgba(64, 158, 255, 0.08);
        border-radius: 3px;
      }
      .mm-dot {
        position: absolute;
        border-radius: 2px;
      }
      .zoombar {
        position: absolute;
        right: 14px;
        bottom: 140px;
        display: flex;
        flex-direction: column;
        gap: 1px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      }
      .zoombar div {
        width: 30px;
        height: 28px;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: var(--text-2);
        font-size: 12px;
      }
      .zoombar div + div {
        border-top: 1px solid var(--border-light);
      }
      .zoombar div:hover {
        background: var(--primary-weak);
        color: var(--primary);
      }

      /* 右侧属性面板 */
      .inspector {
        width: 320px;
        flex: none;
        background: var(--panel);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
      }
      .ins-head {
        flex: none;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border-light);
      }
      .ins-head h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .ins-head p {
        margin: 3px 0 0;
        font-size: 12px;
        color: var(--text-3);
      }
      .ins-body {
        flex: 1;
        overflow: auto;
        padding: 12px 14px 20px;
      }
      .fld {
        margin-bottom: 12px;
      }
      .fld > label {
        display: block;
        font-size: 12px;
        color: var(--text-3);
        margin-bottom: 5px;
      }
      .fld input,
      .fld select,
      .fld textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 13px;
        color: var(--text);
        font-family: inherit;
        background: #fff;
      }
      .fld textarea {
        resize: vertical;
        min-height: 62px;
      }
      .fld input:focus,
      .fld textarea:focus,
      .fld select:focus {
        outline: none;
        border-color: var(--primary);
      }
      .fld .row {
        display: flex;
        gap: 8px;
      }
      .sec {
        margin: 16px 0 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-2);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .sec button {
        border: none;
        background: none;
        color: var(--primary);
        cursor: pointer;
        font-size: 12px;
      }
      .kv {
        border: 1px solid var(--border-light);
        border-radius: 5px;
        overflow: hidden;
      }
      .kv .r {
        display: flex;
        align-items: center;
        font-size: 12px;
      }
      .kv .r + .r {
        border-top: 1px solid var(--border-light);
      }
      .kv .r span {
        padding: 6px 8px;
      }
      .kv .r .k {
        width: 40%;
        color: var(--text-3);
        background: #fafafa;
      }
      .kv .r .v {
        flex: 1;
      }
      .kv .r .u {
        width: 46px;
        color: var(--text-3);
        text-align: right;
      }
      .dev {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 7px 9px;
      }
      .dev .led {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
      }
      .dev b {
        font-weight: 500;
        font-size: 13px;
      }
      .dev .pick {
        margin-left: auto;
        color: var(--primary);
        cursor: pointer;
        font-size: 12px;
      }
      .empty-ins {
        padding: 40px 16px;
        text-align: center;
        color: var(--text-3);
        font-size: 12px;
      }

      /* 状态栏 */
      .statusbar {
        height: 30px;
        flex: none;
        background: var(--panel);
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 14px;
        font-size: 12px;
        color: var(--text-3);
      }
      .statusbar .ok {
        color: var(--success);
      }
      .statusbar .warn {
        color: var(--warning);
      }
      .badge {
        background: #fef0f0;
        color: var(--danger);
        border-radius: 10px;
        padding: 1px 8px;
        font-size: 11px;
      }
      .tip {
        position: fixed;
        left: 50%;
        bottom: 54px;
        transform: translateX(-50%);
        background: rgba(48, 49, 51, 0.92);
        color: #fff;
        padding: 7px 14px;
        border-radius: 5px;
        font-size: 12px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }
      .tip.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- ── 顶栏 ── -->
      <div class="topbar">
        <div class="brand"><i class="dot"></i>FlowEditor</div>
        <input class="fname" id="fname" value="28nm 逻辑工艺流程（FEOL）" />
        <span class="save-state" id="saveState"><i class="led"></i><span>已保存 · 12:04</span></span>
        <div class="spacer"></div>
        <div class="presets" id="presets">
          <span>配置</span>
          <b data-p="mini">mini</b>
          <b data-p="standard" class="on">standard</b>
          <b data-p="pro">pro</b>
        </div>
        <div class="divider"></div>
        <button class="btn hidden" id="btnVersion">⏱ 版本</button>
        <button class="btn hidden" id="btnAI">✦ AI 生成</button>
        <button class="btn hidden" id="btnCollab">👥 协同</button>
        <div class="divider" id="proDivider"></div>
        <div class="btn-group">
          <button class="btn" id="undo">↶ 撤销</button>
          <button class="btn" id="redo">↷ 重做</button>
        </div>
        <div class="divider"></div>
        <button class="btn" id="btnValidate">✓ 校验</button>
        <button class="btn" id="btnLayout">⇄ 自动布局</button>
        <div class="export-wrap">
          <button class="btn" id="btnExport">⤓ 导出 ▾</button>
          <div class="menu" id="exportMenu">
            <div data-t="导出 PNG 图片" data-x="png">PNG <span>2x</span></div>
            <div data-t="导出 JPEG 图片" data-x="jpeg">JPEG <span>—</span></div>
            <div data-t="导出 SVG 矢量图" data-x="svg">SVG <span>—</span></div>
            <div data-t="导出为 .flow.json（可再次导入）" data-x="json">JSON 数据 <span>.flow.json</span></div>
            <div data-t="导出工艺卡 Excel（含参数表）" data-x="excel">工艺卡 Excel <span>P2</span></div>
            <div data-t="调用浏览器打印" data-x="print">打印 <span>Ctrl+P</span></div>
          </div>
        </div>
        <button class="btn primary" id="btnSave">保存</button>
      </div>

      <div class="body">
        <!-- ── 左侧元件库 ── -->
        <aside class="palette">
          <div class="tabs">
            <div class="on" data-tab="lib">元件库</div>
            <div data-tab="tpl">模板</div>
            <div data-tab="layer">图层</div>
          </div>
          <div class="pcfg">
            <select id="palLib" title="palette.preset / palette.groups">
              <option value="full">库：半导体全量（20+）</option>
              <option value="basic">库：基础 6 种</option>
              <option value="custom">库：自定义 4 项</option>
            </select>
            <div class="row">
              <span>palette</span>
              <label class="chk" id="lbSearch"><input type="checkbox" id="palSearch" checked />搜索</label>
              <label class="chk" id="lbCollapse"><input type="checkbox" id="palCollapse" checked />折叠</label>
              <label class="chk" id="lbDrag"><input type="checkbox" id="palDrag" checked />拖拽</label>
            </div>
          </div>
          <div class="search" id="psearchWrap">

        const S = NODES.find((n) => n.id === e.s)
        const T = NODES.find((n) => n.id === e.t)
        if (!S || !T) return
        const sx = S.x + S.w / 2
        const sy = S.y + S.h / 2
        const tx = T.x + T.w / 2
        const ty = T.y + T.h / 2
        let d
        if (e.route === 'wrap') {
          d = `M${sx} ${S.y + S.h} V${e.y} H${tx} V${T.y}`
        } else if (e.route === 'back') {
          d = `M${sx} ${S.y} V${e.y} H${tx} V${T.y}`
        } else {
          d = `M${S.x + S.w} ${sy} H${(S.x + S.w + T.x) / 2} V${ty} H${T.x}`
        }
        const path = document.createElementNS(NS, 'path')
        path.setAttribute('d', d)
        path.setAttribute('fill', 'none')
        path.setAttribute('stroke', e.cls === 'ng' ? '#f56c6c' : '#a8abb2')
        path.setAttribute('stroke-width', '1.6')
        if (e.dashed) path.setAttribute('stroke-dasharray', '6 4')
        path.setAttribute('marker-end', e.cls === 'ng' ? 'url(#ar-d)' : 'url(#ar)')
        svg.appendChild(path)
        edgeCount++
        if (e.label) {
          const lb = document.createElement('div')
          lb.className = 'elabel ' + (e.cls || '')
          lb.textContent = e.label
          const m = path.getPointAtLength(path.getTotalLength() * 0.5)
          lb.style.left = m.x + 'px'
          lb.style.top = m.y + 'px'
          grid.appendChild(lb)
        }
      })

      /* 小地图 */
      const mm = document.getElementById('minimap')
      NODES.forEach((n) => {
        const d = document.createElement('div')
        d.className = 'mm-dot'
        d.style.cssText = `left:${6 + n.x / 10}px;top:${8 + n.y / 10}px;width:${Math.max(4, n.w / 10)}px;height:${Math.max(3, n.h / 10)}px;background:${
          n.color && n.color.startsWith('--') ? '#409eff' : n.color || '#409eff'
        };opacity:.55`
        mm.appendChild(d)
      })
      const vp = document.getElementById('vp')
      vp.style.cssText = 'left:6px;top:8px;width:96px;height:62px'

      /* 选中与属性面板 */
      function select(id) {
        selected = id
        Object.values(nodeEl).forEach((el) => el.classList.remove('sel'))
        nodeEl[id] && nodeEl[id].classList.add('sel')
        const d = INSPECT[id]
        const insBody = document.getElementById('insBody')
        document.getElementById('insTitle').textContent = d ? d.title : '节点属性'
        document.getElementById('insSub').textContent = d ? d.sub : '该节点暂无扩展属性'
        if (!d) {
          insBody.innerHTML =
            '<div class="empty-ins">该节点暂无扩展属性<br />可在下方补充名称与备注</div>'
          return
        }
        // 配置驱动：mini 只留名称与编号；pro 才有设备绑定与工艺参数表
        const isPro = CFG.inspector === 'pro'
        const fields = CFG.inspector === 'basic' ? d.fields.slice(0, 2) : d.fields
        insBody.innerHTML =
          fields
            .map((f) => {
              if (f.type === 'select') {
                return `<div class="fld"><label>${f.l}</label><select>${f.opts
                  .map((o) => `<option${o === f.v ? ' selected' : ''}>${o}</option>`)
                  .join('')}</select></div>`
              }
              return `<div class="fld"><label>${f.l}</label><input value="${f.v}" /></div>`
            })
            .join('') +
          (isPro
            ? `<div class="sec">绑定设备<button>从设备树选择</button></div>
           <div class="dev">
             <i class="led" style="background:var(--${d.device.status === 'available' ? 'success' : 'warning'})"></i>
             <b>${d.device.name}</b>
             <span class="pick">更换</span>
           </div>` +
              `<div class="sec">工艺参数<button>+ 添加</button></div>
           <div class="kv">${d.params
             .map(
               (p) =>
                 `<div class="r"><span class="k">${p.k}</span><span class="v">${p.v}</span><span class="u">${p.u}</span></div>`
             )
             .join('')}</div>`
            : '') +
          `<div class="sec">备注</div><div class="fld"><textarea>${d.remark}</textarea></div>`
      }
      /* 配置档位切换：同一组件在 mini / standard / pro 下的差异 */
      function applyPreset(p) {
        CFG = PRESETS[p]
        document
          .querySelectorAll('#presets b')
          .forEach((b) => b.classList.toggle('on', b.dataset.p === p))
        const show = (id, on) => {
          const el = document.getElementById(id)
          el && el.classList.toggle('hidden', !on)
        }
        show('btnValidate', CFG.validate)
        show('btnLayout', CFG.layout)
        show('btnVersion', CFG.pro)
        show('btnAI', CFG.pro)
        show('btnCollab', CFG.pro)
        show('proDivider', CFG.pro)
        show('minimap', CFG.minimap)
        show('statIssue', CFG.validate)
        const tplTab = document.querySelector('.tabs div[data-tab="tpl"]')
        tplTab && tplTab.classList.toggle('hidden', !CFG.pro)
        document.querySelectorAll('#exportMenu div').forEach((d) => {
          d.classList.toggle('hidden', !CFG.exports.includes(d.dataset.x))
        })
        // 档位给元件库默认值：mini → 基础 6 种，standard/pro → 半导体全量
        PAL.lib = CFG.palette === 'basic' ? 'basic' : 'full'
        const palLib = document.getElementById('palLib')
        if (palLib) palLib.value = PAL.lib
        renderPalette(document.getElementById('psearch').value.trim())
        select(selected || 'n4')
        toast('配置已切换：' + CFG.desc)
      }
      document.getElementById('presets').onclick = (e) => {
        const b = e.target.closest('b')
        if (b) applyPreset(b.dataset.p)
      }
      applyPreset('standard')

      /* 元件库配置交互（palette） */
      const palSearch = document.getElementById('psearch')
      document.getElementById('palLib').onchange = (e) => {
        PAL.lib = e.target.value
        renderPalette(palSearch.value.trim())
        toast('palette 已切换 · ' + e.target.selectedOptions[0].textContent.trim())
      }
      ;[
        ['palSearch', 'searchable'],
        ['palCollapse', 'collapsible'],
        ['palDrag', 'draggable']
      ].forEach(([id, key]) => {
        const el = document.getElementById(id)
        el.onchange = () => {
          PAL[key] = el.checked
          el.parentElement.classList.toggle('off', !el.checked)
          renderPalette(palSearch.value.trim())
          toast(`palette.${key} = ${el.checked}`)
        }
      })

      /* 统计 */
      document.getElementById('statNodes').textContent = NODES.length
      document.getElementById('statEdges').textContent = edgeCount

      /* 顶栏交互 */
      let zoom = 100
      const zText = document.getElementById('zoomText')
      document.getElementById('zIn').onclick = () => {
        zoom = Math.min(200, zoom + 10)
        zText.textContent = zoom + '%'
      }
      document.getElementById('zOut').onclick = () => {
        zoom = Math.max(40, zoom - 10)
        zText.textContent = zoom + '%'
      }
      document.getElementById('zFit').onclick = () => {
        zoom = 100
        zText.textContent = '100%'
        toast('适应画布（F14）')
      }
      const menu = document.getElementById('exportMenu')
      document.getElementById('btnExport').onclick = (e) => {
        e.stopPropagation()
        menu.classList.toggle('open')
      }
      document.addEventListener('click', () => menu.classList.remove('open'))
      menu.querySelectorAll('div').forEach((d) => {
        d.onclick = () => toast(d.dataset.t)
      })
      document.getElementById('btnSave').onclick = () => {
        document.getElementById('saveState').classList.remove('is-dirty')
        document.getElementById('saveState').querySelector('span').textContent = '已保存 · 刚刚'
        document.getElementById('statSave').textContent = '草稿已自动保存 · 刚刚'
        toast('已保存到服务端（F12）')
      }
      document.getElementById('btnValidate').onclick = () =>
        toast('校验：2 项待处理 —— 孤立节点「下一工序段」、缺出口（F16）')
      document.getElementById('btnLayout').onclick = () => toast('按 DAG 从左到右重新排布（E1）')
      document.getElementById('undo').onclick = () => toast('撤销上一步（F7）')
      document.getElementById('fname').oninput = () => {
        document.getElementById('saveState').classList.add('is-dirty')
        document.getElementById('saveState').querySelector('span').textContent = '未保存的改动'
        document.getElementById('statSave').className = 'warn'
        document.getElementById('statSave').textContent = '有未保存改动 · 自动保存已开启'
      }
      document.querySelectorAll('.fld input, .fld textarea').forEach(() => {})
      document.addEventListener('input', (e) => {
        if (e.target.closest('.ins-body')) {
          document.getElementById('saveState').classList.add('is-dirty')
          document.getElementById('saveState').querySelector('span').textContent = '未保存的改动'
        }
      })
    </script>
  </body>
</html>
