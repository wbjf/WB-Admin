name: Deploy to GitHub Pages

# 部署线上演示站与文档站：
#   演示站  https://wbjf.github.io/WB-Admin/
#   文档站  https://wbjf.github.io/WB-Admin/docs/
#
# 为什么演示站要单独一个构建模式（而不是复用 npm run build）：
#   1. GitHub Pages 项目站挂在 /WB-Admin/ 子路径下，base 必须跟着改，
#      否则所有资源都会去域名根目录找 → 整站 404；
#   2. 静态托管没有后端，而本项目的 mock 中间件挂在 Vite dev server 上
#      （src/mock/plugin.ts 的 configureServer），静态产物里不会被加载。
#      所以 pages 模式必须开着 VITE_USE_MOCK，由 src/mock/adapter.ts
#      在浏览器内提供全部接口。
#   详见 .env.pages。
#
# 文档站为什么挂在子目录：一个仓库只有一个 Pages 站点，根路径已被演示站占用。
# 它的 base 写在 docs/.vitepress/config.ts —— 别改用 CLI --base，
# 该文件里有踩坑说明（Windows Git Bash 会改写以 / 开头的参数）。
# 两个产物合并进同一个 artifact：dist/（应用）+ dist/docs/（文档）。

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只保留最新一次部署，排队中的旧任务取消
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install
        run: npm install --no-audit --no-fund

      # 顺序不能调换：vite build 会先清空 dist，文档必须建在它之后
      - name: Build (pages mode)
        run: npm run build:pages

      - name: Build docs
        run: npm run docs:build:pages

      # 生成兜底页：文档路径回文档站 + 应用深链接交给 history 路由
      # 路径不要从命令行传（Windows Git Bash 会改写以 / 开头的参数），
      # 脚本内部有前缀自检，对不上会直接失败
      - name: SPA fallback (404.html)
        run: node scripts/make-404.js dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
